
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        
body {
    font-family: Arial, sans-serif;
    background-color: #f2f4f8;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

h2 {
    text-align: center;
    color: #333;
    font-size: 28px;
    margin: 0 0 25px 0;
}

form {
    background-color: white;
    padding: 30px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: left;
}

input {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #1d4ed8;
}

    </style>
</head>

<body>

    

    <form action="/login" method="POST">
        <h2>Login</h2>

        Email:
        <input type="text" name="email" required>

        <br><br>

        Password:
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
