
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
</head>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f4f8;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

h1 {
    text-align: center;
    color: #333;
    font-size: 28px;
    margin: 0 0 25px 0;
}

form {
    background-color: white;
    padding: 30px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

input, select {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #1d4ed8;
}
</style>
<body>

    <form action="/complete_profile" method="POST">

        <input
            type="number"
            name="age"
            placeholder="Enter your age"
            min="1"
            required
        >

        <br><br>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <br><br>

        <input
            type="text"
            name="address"
            placeholder="Enter your address"
            required
        >

        <br><br>

        <input
            type="tel"
            name="phone"
            placeholder="Enter 10 digit phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            minlength="10"
            inputmode="numeric"
            required
        >

        <br><br>

        <button type="submit">Complete Profile</button>

    </form>

</body>
</html>
