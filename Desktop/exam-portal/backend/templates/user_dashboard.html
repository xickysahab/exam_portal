
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background-color: white;
            padding: 40px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Welcome</h1>

        <button>
            <a href="/complete_profile">Complete Your Profile</a>
        </button>

    </div>

</body>
</html>
